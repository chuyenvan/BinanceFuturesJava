# ============================================================================
# PROFILE GIAO DICH — C2b (ung vien freeze, DEV 2022-01..2024-06)
# Day la NGUON SU THAT DUY NHAT cho tham so giao dich. Chay:
#   TRADING_PROFILE=/home/ubuntu/java/profiles/c2b.properties java -cp <jar> <Main>
# Khi da dat TRADING_PROFILE, moi env tham so giao dich (SIM_*, DCA_*, TS_*, SELECTOR_*, ...) bi TU CHOI (fail-fast).
# Bien ha tang (WFO_DATA_DIR, SIM_END_DATE, EXCHANGE_INFO_PATH, ...) van dat qua env.
# Key khai bao o day ma khong ai doc -> Cfg.auditProfile() bao ngay (bat loi go sai ten key).
# ============================================================================

# --- SELECTOR: chon coin trong tick ---
SELECTOR_RANK_TOPK=8
SELECTOR_ONLY_ENTRY=1

# --- BINS SELECTOR (PIN 2026-09-03) ---
# Day la BIEN QUYET DINH cua S1: +7.35pp CAGR va maxDD -13.12 vs -20.82 so voi bins G015 o
# CUNG thang exit cua profile nay (C2_g015 b:51903 vs C2a b:59471). SELECTOR_RANK_TOPK /
# SELECTOR_ONLY_ENTRY KHONG lam nen S1 - hai key do giong y nguyen o run C2_g015.
# Truoc 2026-09-03 key nay o Cfg.INFRA_KEYS (dat tuy y qua env, khong pin) va thieu no thi
# WfoDataset chi LOG.warn roi fallback Aerospike => ra so KHAC ma khong bao loi.
# Nay: thieu / tro sai => ExportWfoDataset THROW (fail cung).
# sha256 tung file bins: research/pipeline/BINS_MANIFEST.md muc 2.
# Sao luu ngoai may: Kaggle dataset PRIVATE chuyendinh/predwf-map-s1a2-bins version 1.
WFO_FUNDING_PRED_DIR=/home/ubuntu/predwf_map_s1a2

# --- GATE: dieu kien thi truong de duoc vao lenh ---
# Nguong THUC TE = SIM_MIN_MOMENTUM_15M * max(SIM_AI_DYNAMIC_MIN, score/0.15 * SIM_AI_DYNAMIC_MULTIPLIER)
#   KHONG CO CAN TREN: code chi co Math.max, nhanh Math.min(..., AI_DYNAMIC_MAX) da bi xoa.
#   => nguong TANG DON DIEU theo score: 0.00214 -> 0.02206. Khong co nguong hang so.
#   AI_DYNAMIC_MAX la tran UNG VIEN o tang 1, ma tang 1 BI BO QUA khi SELECTOR_RANK_TOPK>0.
#   Sua 2026-09-03; ban cu ghi clamp co tran => hang 1.713 phan tram la SAI. Xem docs/C2B_SPEC.md muc 0.
SIM_MIN_MOMENTUM_15M=0.008

# --- EXIT: arm + trailing + cat lo ---
SIM_RATE_PROFIT_STOP_MARKET=0.07
SIM_TS_GIVEBACK=1
SIM_LOSER_TIME_STOP_HOURS=168
# 2026-09-03 (B3): 3 tham so exit duoi day TRUOC DAY VO HINH — khong co trong file cau hinh nao,
# chi ton tai lam default hardcode trong Java. Nay ghi ro bang dung gia tri dang chay.
TS_GIVEBACK_RATIO=0.5

# --- SIZING ---
DCA_GRID_SCALE=1.5
TIER_FLAT=1
# 2026-09-03 (B3): BASE_BUDGET = CAPITAL_START / NUMBER_ORDER_BUDGET = 35000/50 = 700 USDT / lenh.
# Truoc day nam trong config.properties (CAPITAL_START) va default Java (50) — khong ai nhin cung mot cho.
CAPITAL_START=35000

# --- DCA (tat: chi 1 leg, toan bo budget) ---
DCA_GRID_ENABLED=true
DCA_GRID_WEIGHTS=1,0,0,0

# --- CHI PHI & FUNDING ---
SIM_APPLY_FUNDING=true
SIM_FUNDING_MARK=true

# --- BREAKER ---
SIM_BREAKER_MODE=OFF

# --- SLEEVE ---
# false = giu sleeve selector (hanh vi dang chay). true = tat het, chi con DCA_LEVEL1 + BIG_DOWN.

# ============================================================================
# C2C_ROUND — 2026-09-03
# = c2b_min + 3 hang so AI_DYNAMIC lam TRON, theo yeu cau cua Uni ("param 4 chu
#   so thap phan la overfit roi").
#
# Bang chung cho phep lam tron:
#   - PREREG_RND.md: RND1 (2 chu so) va RND2 (so tron) PASS moi tieu chi.
#   - CI_REAUDIT.md: hieu CAGR C2b-vs-RND1 = +0.32pp, CI [-0.08,+0.81];
#     C2b-vs-RND2 = +0.45pp, CI [-0.63,+1.46] => KHONG PHAN BIET DUOC.
#     387/544 USDT nam hoan toan trong nhieu. Lam tron la MIEN PHI.
#
# LUU Y: default trong Configs.java:307-309 CO Y GIU NGUYEN (1.28760/0.26787/
# 2.14135) de khong pha moc byte-identity cua cong nghiem thu parity. Tham so
# giao dich thuoc PROFILE, khong thuoc default hardcode.
#
# CHUA phai baseline mac dinh. Quyet dinh chuyen baseline (sang day hay sang mot
# diem plateau cua GS wave-1) de SAU khi wave-1 ket thuc.
# ============================================================================
SIM_AI_DYNAMIC_MULTIPLIER=1.3
SIM_AI_DYNAMIC_MIN=0.25
SIM_AI_DYNAMIC_MAX=2.0
