# DINH CHINH 2026-09-03: ban cu o day ghi clamp co ca can tren => nguong hang 1.713 phan tram.
#   Do la SAI. Xem docs/C2B_SPEC.md muc 0.
SIM_MIN_MOMENTUM_15M=0.014052

