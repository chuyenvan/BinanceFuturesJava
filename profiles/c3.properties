# Nay: thieu / tro sai => ExportWfoDataset THROW (fail cung).
# sha256 tung file bins: research/pipeline/BINS_MANIFEST.md muc 2.
# Sao luu ngoai may: Kaggle dataset PRIVATE chuyendinh/predwf-map-s1a2-bins version 1.
