# ============================================================================
# config.properties — ban trong REPO (dung cho tool va lam goc cho box live).
# CHI chua tham so HA TANG. Tham so GIAO DICH nam trong profiles/*.properties (di qua Cfg).
# Cho sim/backtest tren Oracle dung configs/sim_dev.properties (khac namespace, TIME_RUN).
#
# 2026-09-03 (B3) da XOA 9 key KHONG AI DOC (gia tri trong file la sai su that):
#   AEROSPIKE_SET_NAME_FUNDING_PRED, AEROSPIKE_SET_NAME_PRED_40  (code hardcode trong DataManagerAerospikeFloatSim)
#   NUMBER_TICKER_CAL_RATE_CHANGE  (code hardcode 15 trong Configs)
#   PROFIT_RATE, TIME_START, STABLE_SYMBOLS, BTC_REVERSE_SYMBOLS,
#   FILE_AI_DCA_PREDICTIONS, FILE_ENTRY_MARKET_LEVEL
# Va xoa 3 dong gateway AI (url/virtual-key/model): khong co dau '=' nen parser BO QUA hoan toan
