# ============================================================================
# config.properties cho SIM/BACKTEST tren Oracle — BAN CHUAN, CO TRONG GIT.
#
# Truoc 2026-09-03 moi thu muc chay lay config.properties bang "cp" tu MOT THU MUC
# THI NGHIEM CU (devrun/G1_giveback5) — khong ban nao nam trong git, 24 bien the khac
# nhau tren o dia, va file chay khac han file trong repo (namespace test vs ticker,
# TIME_RUN 20220101 vs 20210101). Nghia la khong ai tai lap duoc mot lan chay tu repo.
# Tu nay: run script PHAI copy tu file nay.
#
# File nay CHI chua tham so HA TANG (nguon du lieu, duong dan, danh sach symbol, von goc).
# MOI tham so GIAO DICH nam trong profile (vd profiles/c2b.properties) va di qua Cfg.
#
# 20 key da bi XOA vi KHONG AI DOC — gia tri cua chung trong file cu la SAI SU THAT:
#   RATE_FEE=0.001            (code dung 0.002)
#   RATE_PROFIT_STOP_MARKET=0.1 (code dung 0.03, run C2b dung 0.07 qua env)
#   LEVERAGE_ORDER, NUMBER_ENTRY_EACH_SIGNAL, NUMBER_HOUR_FUNDING_CAL, PROFIT_RATE,
#   TIME_START, IS_KAGGLE_MODE, STABLE_SYMBOLS, NUMBER_TICKER_CAL_RATE_CHANGE,
#   BTC_TREND_REVERSE_{DURATION,RATE_MAX,RATE_MIN,RATE_MIN_TRADE},
#   FUNDING_{MAX,MIN}_TRADE, FILE_AI_DCA_PREDICTIONS, FILE_ENTRY_MARKET_LEVEL,
#   AEROSPIKE_SET_NAME_{FUNDING_PRED,PRED_40}
# Configs se CANH BAO neu file lai xuat hien key khong ai doc; CONFIG_STRICT=1 -> dung han.
# ============================================================================

# --- NGUON DU LIEU (TASK-112: tuong minh per-box) ---
AEROSPIKE_READ_CLUSTER=226
TICKER_SOURCE=aerospike
AEROSPIKE_HOST=103.157.218.242
AEROSPIKE_PORT=3222
AEROSPIKE_NAMESPACE=test
AEROSPIKE_NAMESPACE_242=ticker
AEROSPIKE_HOST_226=127.0.0.1
AEROSPIKE_PORT_226=3222

# --- GHI KET QUA ---
# true = sim ghi storage/*.data + printDone.csv sau khi chay xong (bat buoc de cham diem).
WRITE_SIM_STORAGE=true

# --- PHAM VI & DUONG DAN ---
TIME_RUN=20220101
FILE_AI_PREDICTIONS=../storage/ai_ml/ai_predictions.data_v3_FULL

# --- UNIVERSE ---
# DIED_SYMBOLS = chi loai symbol KHONG phai coin giao dich that (BTCDOM index, USDC).
# KHONG loai coin da chet: 30 coin chet da duoc backfill du data va GIU trong backtest -> chong survivorship.
DIED_SYMBOLS=BTCDOM,USDC
SPECIAL_SYMBOLS=BNB,ETH,XRP,ADA

# --- VON & THREAD ---
# CAPITAL_START la GOC tinh size: BASE_BUDGET = CAPITAL_START / NUMBER_ORDER_BUDGET.
# Profile co the ghi de ca hai (Cfg > properties).
CAPITAL_START=35000
NUMBER_THREAD_ORDER_MANAGER=2
